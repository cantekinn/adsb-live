<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>ADS-B 3D Globe</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.119.0/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
    #cesiumContainer { position: absolute; inset: 0; }
    .cesium-viewer-bottom { display: none !important; }
    header {
      position: absolute; top: 0; left: 0; right: 0; height: 48px;
      background: rgba(10,14,20,0.9); backdrop-filter: blur(10px);
      border-bottom: 1px solid #1f2937; z-index: 1000;
      display: flex; align-items: center; padding: 0 16px; gap: 20px;
    }
    h1 { font-size: 16px; margin: 0; color: #4cc9f0; font-weight: 600; }
    h1::before { content: '🌍 '; }
    .stats { display: flex; gap: 16px; font-size: 11px; color: #94a3b8; }
    .stats b { color: #4cc9f0; font-family: Consolas, monospace; font-size: 14px; }
    .back-link {
      margin-left: auto; color: #4cc9f0; text-decoration: none;
      padding: 6px 12px; border: 1px solid #4cc9f0; border-radius: 5px;
      font-size: 12px;
    }
    .back-link:hover { background: rgba(76,201,240,0.15); }
    #ac-info {
      position: absolute; bottom: 16px; left: 16px; min-width: 280px;
      background: rgba(14,20,32,0.92); backdrop-filter: blur(10px);
      border: 1px solid #1f2937; border-radius: 8px; padding: 14px;
      color: #e0e6ed; font-size: 13px; display: none; z-index: 800;
    }
    /* Kontrol butonlari */
    #controls {
      position: absolute; top: 64px; right: 16px; z-index: 700;
      display: flex; flex-direction: column; gap: 6px;
    }
    #controls button {
      width: 40px; height: 40px;
      background: rgba(14,20,32,0.92); backdrop-filter: blur(8px);
      border: 1px solid #1f2937; border-radius: 6px;
      color: #4cc9f0; cursor: pointer; font-size: 18px;
      transition: all 0.15s;
    }
    #controls button:hover {
      background: rgba(76,201,240,0.2);
      transform: scale(1.05);
    }
    /* Yardim paneli */
    #help-panel {
      position: absolute; bottom: 16px; right: 16px; z-index: 700;
      background: rgba(14,20,32,0.92); backdrop-filter: blur(8px);
      border: 1px solid #1f2937; border-radius: 6px;
      padding: 10px 14px; font-size: 11px; color: #94a3b8;
      max-width: 240px; display: none;
    }
    #help-panel.open { display: block; }
    #help-panel h4 { font-size: 11px; color: #4cc9f0;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin: 0 0 6px; }
    #help-panel .row { margin: 3px 0; }
    #help-panel kbd {
      display: inline-block; padding: 1px 5px;
      background: #0a0e14; border: 1px solid #4cc9f0;
      border-radius: 3px; font-family: Consolas, monospace;
      font-size: 10px; color: #4cc9f0; min-width: 50px;
      text-align: center;
    }
    #ac-info.open { display: block; }
    #ac-info .cs { font-size: 18px; color: #4cc9f0; font-weight: 700; }
    #ac-info .icao { font-size: 10px; color: #64748b;
      font-family: Consolas, monospace; }
    #ac-info .row { display: flex; justify-content: space-between;
      margin-top: 6px; font-family: Consolas, monospace; }
    #ac-info .row span:first-child { color: #64748b; font-size: 11px;
      text-transform: uppercase; }
  </style>
</head>
<body>
  <header>
    <h1>ADS-B 3D Globe</h1>
    <div class="stats">
      <span>Ucak: <b id="ac-count">0</b></span>
      <span>Mesaj: <b id="msg-count">0</b></span>
      <span>CRC ok: <b id="crc-count">0</b></span>
    </div>
    <a href="/" class="back-link">← 2D Harita</a>
  </header>

  <div id="cesiumContainer"></div>

  <!-- KONTROL BUTONLARI -->
  <div id="controls">
    <button id="zoom-in" title="Yaklas (+)">＋</button>
    <button id="zoom-out" title="Uzaklas (-)">－</button>
    <button id="home" title="Anavatan (Turkiye)">🏠</button>
    <button id="north" title="Kuzeyi yukari al (N)">⇧</button>
    <button id="tilt" title="2D / 3D goruntu degistir (V)">⟳</button>
    <button id="help-btn" title="Yardim (?)">?</button>
  </div>

  <!-- YARDIM PANELI -->
  <div id="help-panel">
    <h4>Kontroller</h4>
    <div class="row"><kbd>SOL+SURUKLE</kbd> Pan</div>
    <div class="row"><kbd>SAG+SURUKLE</kbd> Egim/donme</div>
    <div class="row"><kbd>TEKER</kbd> Yaklas/uzaklas</div>
    <div class="row"><kbd>W A S D</kbd> Klavye ile uc</div>
    <div class="row"><kbd>+/-</kbd> Zoom</div>
    <div class="row"><kbd>N</kbd> Kuzeyi yukari</div>
    <div class="row"><kbd>H</kbd> Anavatan</div>
    <div class="row"><kbd>V</kbd> 2D/3D</div>
    <div class="row"><kbd>?</kbd> Bu paneli ac/kapat</div>
  </div>

  <div id="ac-info">
    <div class="cs" id="i-cs">--</div>
    <div class="icao" id="i-icao">------</div>
    <div class="row"><span>Altitude</span><span id="i-alt">--</span></div>
    <div class="row"><span>Speed</span><span id="i-spd">--</span></div>
    <div class="row"><span>Heading</span><span id="i-hdg">--</span></div>
    <div class="row"><span>Position</span><span id="i-pos">--</span></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.119.0/Build/Cesium/Cesium.js"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.119.0/Build/Cesium/';
    Cesium.Ion.defaultAccessToken = '';

    // Viewer'i hicbir imagery olmadan baslat
    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayer: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      animation: false,
      timeline: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false,
      shouldAnimate: true,
    });
    console.log('[CESIUM] Viewer hazir');

    // Imagery layer ekle - 3 fallback ile
    function tryAddImagery(url, name, opts={}) {
      try {
        const provider = new Cesium.UrlTemplateImageryProvider({
          url: url, maximumLevel: 18, ...opts,
        });
        viewer.imageryLayers.addImageryProvider(provider);
        console.log('[CESIUM] Imagery yuklendi:', name);
        return true;
      } catch (e) {
        console.error('[CESIUM] Imagery FAIL', name, e);
        return false;
      }
    }
    // ESRI World Imagery (satellite) en guvenilir
    tryAddImagery(
      'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      'ESRI Satellite'
    );

    // Kamera baslangic Turkiye
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(35, 39, 8_000_000),
    });

    // Atmosfer + lighting
    viewer.scene.globe.enableLighting = true;
    viewer.scene.skyAtmosphere.show = true;

    // Kamera kontrolu daha hassas
    const controller = viewer.scene.screenSpaceCameraController;
    controller.minimumZoomDistance = 1000;       // 1 km
    controller.maximumZoomDistance = 50_000_000; // 50000 km
    controller.inertiaSpin = 0.7;
    controller.inertiaTranslate = 0.7;
    controller.inertiaZoom = 0.7;
    controller.enableTilt = true;
    controller.enableLook = true;

    // ===== KONTROL BUTONLARI =====
    const HOME_POSITION = Cesium.Cartesian3.fromDegrees(35, 39, 8_000_000);

    function flyHome() {
      viewer.camera.flyTo({
        destination: HOME_POSITION,
        orientation: { heading: 0, pitch: -Cesium.Math.PI_OVER_TWO, roll: 0 },
        duration: 1.5,
      });
    }
    function zoomBy(factor) {
      const distance = Cesium.Cartesian3.distance(
        viewer.camera.positionWC, viewer.scene.globe.ellipsoid.cartesianToCartographic(viewer.camera.positionWC) ? viewer.scene.globe.ellipsoid.cartographicToCartesian(viewer.scene.globe.ellipsoid.cartesianToCartographic(viewer.camera.positionWC)) : viewer.camera.positionWC
      ) || 1_000_000;
      viewer.camera.zoomIn(distance * factor);
    }
    function lookNorth() {
      viewer.camera.flyTo({
        destination: viewer.camera.position,
        orientation: { heading: 0, pitch: viewer.camera.pitch, roll: 0 },
        duration: 0.8,
      });
    }
    function toggle2D3D() {
      const m = viewer.scene.mode;
      viewer.scene.morphTo2D(0); // basit
      if (m !== Cesium.SceneMode.SCENE2D) viewer.scene.morphTo2D(1.5);
      else viewer.scene.morphTo3D(1.5);
    }

    document.getElementById('zoom-in').onclick = () => viewer.camera.zoomIn(viewer.camera.positionCartographic.height * 0.3);
    document.getElementById('zoom-out').onclick = () => viewer.camera.zoomOut(viewer.camera.positionCartographic.height * 0.4);
    document.getElementById('home').onclick = flyHome;
    document.getElementById('north').onclick = lookNorth;
    document.getElementById('tilt').onclick = toggle2D3D;
    document.getElementById('help-btn').onclick = () => {
      document.getElementById('help-panel').classList.toggle('open');
    };

    // ===== KLAVYE =====
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, textarea')) return;
      const camera = viewer.camera;
      const h = camera.positionCartographic.height;
      const moveAmt = h * 0.1;
      const rotateAmt = Cesium.Math.PI / 30;
      switch(e.key.toLowerCase()) {
        case 'w': camera.moveForward(moveAmt); e.preventDefault(); break;
        case 's': camera.moveBackward(moveAmt); e.preventDefault(); break;
        case 'a': camera.moveLeft(moveAmt); e.preventDefault(); break;
        case 'd': camera.moveRight(moveAmt); e.preventDefault(); break;
        case 'q': camera.twistLeft(rotateAmt); e.preventDefault(); break;
        case 'e': camera.twistRight(rotateAmt); e.preventDefault(); break;
        case '+': case '=': camera.zoomIn(h * 0.3); e.preventDefault(); break;
        case '-': case '_': camera.zoomOut(h * 0.4); e.preventDefault(); break;
        case 'n': lookNorth(); e.preventDefault(); break;
        case 'h': flyHome(); e.preventDefault(); break;
        case 'v': toggle2D3D(); e.preventDefault(); break;
        case '?': case '/':
          document.getElementById('help-panel').classList.toggle('open');
          e.preventDefault(); break;
      }
    });

    // Ucak entityleri
    const entities = {};
    let selectedICAO = null;

    function altColor(alt) {
      if (alt == null) return Cesium.Color.GRAY;
      if (alt < 5000) return Cesium.Color.fromCssColorString('#7c3aed');
      if (alt < 15000) return Cesium.Color.fromCssColorString('#06b6d4');
      if (alt < 25000) return Cesium.Color.fromCssColorString('#10b981');
      if (alt < 35000) return Cesium.Color.fromCssColorString('#eab308');
      return Cesium.Color.fromCssColorString('#ef4444');
    }

    function updateAircraft(ac) {
      if (ac.lat == null || ac.lon == null) return;
      const altM = (ac.altitude || 0) * 0.3048;  // ft -> meters
      const pos = Cesium.Cartesian3.fromDegrees(ac.lon, ac.lat, altM);
      const color = altColor(ac.altitude);
      if (entities[ac.icao]) {
        entities[ac.icao].position = pos;
        entities[ac.icao].point.color = color;
      } else {
        entities[ac.icao] = viewer.entities.add({
          id: ac.icao,
          position: pos,
          point: {
            pixelSize: 8, color: color,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 1,
            heightReference: Cesium.HeightReference.NONE,
          },
          label: {
            text: ac.callsign || ac.icao,
            font: '10pt Consolas',
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -10),
            scaleByDistance: new Cesium.NearFarScalar(1.5e5, 1.0, 2e7, 0.3),
          },
        });
      }
      // Track polyline (history)
      if (ac.track && ac.track.length >= 2) {
        const positions = ac.track.map(p =>
          Cesium.Cartesian3.fromDegrees(p[1], p[0], altM));
        const trackId = ac.icao + '_track';
        if (entities[trackId]) {
          entities[trackId].polyline.positions = positions;
        } else {
          entities[trackId] = viewer.entities.add({
            id: trackId,
            polyline: {
              positions: positions,
              width: 1.5,
              material: color.withAlpha(0.5),
              clampToGround: false,
            }
          });
        }
      }
    }

    function showInfo(icao) {
      selectedICAO = icao;
      const ac = window._lastAircraft?.find(a => a.icao === icao);
      if (!ac) return;
      document.getElementById('i-cs').textContent = ac.callsign || ac.icao;
      document.getElementById('i-icao').textContent = ac.icao;
      document.getElementById('i-alt').textContent = ac.altitude ? `${ac.altitude.toLocaleString()} ft` : '--';
      document.getElementById('i-spd').textContent = ac.speed ? `${ac.speed.toFixed(0)} kt` : '--';
      document.getElementById('i-hdg').textContent = ac.heading ? `${ac.heading.toFixed(0)}°` : '--';
      document.getElementById('i-pos').textContent = (ac.lat && ac.lon) ?
        `${ac.lat.toFixed(3)}, ${ac.lon.toFixed(3)}` : '--';
      document.getElementById('ac-info').classList.add('open');
    }

    // Click handler
    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
    handler.setInputAction(click => {
      const picked = viewer.scene.pick(click.position);
      if (Cesium.defined(picked) && picked.id && !picked.id.id.endsWith('_track')) {
        showInfo(picked.id.id);
        viewer.zoomTo(picked.id);
      } else {
        document.getElementById('ac-info').classList.remove('open');
        selectedICAO = null;
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    // Socket
    const socket = io();
    socket.on('aircraft_update', data => {
      const aircraft = data.aircraft || [];
      window._lastAircraft = aircraft;
      const stats = data.stats || {};
      document.getElementById('ac-count').textContent = aircraft.length;
      document.getElementById('msg-count').textContent = stats.df17_decoded || 0;
      document.getElementById('crc-count').textContent = stats.crc_ok || 0;
      const seen = new Set();
      for (const ac of aircraft) {
        seen.add(ac.icao);
        seen.add(ac.icao + '_track');
        updateAircraft(ac);
      }
      // Sahnedeki ama datada olmayanlari sil
      for (const id in entities) {
        if (!seen.has(id)) {
          viewer.entities.remove(entities[id]);
          delete entities[id];
          if (selectedICAO === id) {
            document.getElementById('ac-info').classList.remove('open');
            selectedICAO = null;
          }
        }
      }
      if (selectedICAO) showInfo(selectedICAO);
    });
  </script>
</body>
</html>
